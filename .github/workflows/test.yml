name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify usage classification and missing data
        shell: powershell
        run: |
          ./tests/usage.tests.ps1
          ./tests/read-usage.tests.ps1
          ./tests/persistent-usage.tests.ps1
      - name: Verify idle poses and walking boundaries
        shell: powershell
        run: ./tests/behavior.tests.ps1
      - name: Verify quota expressions and stale data
        shell: powershell
        run: ./tests/mood.tests.ps1
      - name: Verify preferences and interrupted transitions
        shell: powershell
        run: ./tests/preferences.tests.ps1
      - name: Verify raster frames and transparency
        shell: powershell
        run: ./tests/sprite.tests.ps1
      - name: Verify hand-drawn action expressions
        shell: powershell
        run: ./tests/handdrawn.tests.ps1
      - name: Verify source encodings and Android frame size
        shell: powershell
        run: ./tests/source.tests.ps1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install mobile component build dependencies
        run: python -m pip install -r mobile-sync/requirements.txt
      - name: Verify mobile settings and HTTPS lifecycle
        shell: powershell
        run: |
          ./tests/mobile.tests.ps1
          python -m unittest discover -s mobile-sync -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify standalone bridge pairing and stalled handshakes
        shell: powershell
        run: |
          python -m unittest discover -s bridge -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        shell: powershell
        run: ./build.ps1
