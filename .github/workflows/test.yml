name: Windows checks
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify usage classification and missing data
        shell: powershell
        run: ./tests/usage.tests.ps1
      - name: Verify idle poses and walking boundaries
        shell: powershell
        run: ./tests/behavior.tests.ps1
      - name: Verify quota expressions and stale data
        shell: powershell
        run: ./tests/mood.tests.ps1
      - name: Verify preferences and interrupted transitions
        shell: powershell
        run: ./tests/preferences.tests.ps1
      - name: Verify raster frames and transparency
        shell: powershell
        run: ./tests/sprite.tests.ps1
      - name: Verify hand-drawn action expressions
        shell: powershell
        run: ./tests/handdrawn.tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install mobile component build dependencies
        run: python -m pip install -r mobile-sync/requirements.txt
      - name: Verify mobile settings and HTTPS lifecycle
        shell: powershell
        run: |
          ./tests/mobile.tests.ps1
          python -m unittest discover -s mobile-sync -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        shell: powershell
        run: ./build.ps1
